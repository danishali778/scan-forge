[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pentagi-shared"
version = "0.1.0"
description = "Shared typed contracts for the Pentagi rewrite."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]
